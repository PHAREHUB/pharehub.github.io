{% if standalone %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% endif %}
<title>{% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
{% include "phare.css" %}
</style>
{% if standalone %}
</head>
<body>
{% endif %}
<div class="wrap">
{% block body %}{% endblock %}
<footer>
  Generated {{ generated_at_text | default("") }} from the GitHub API and the LPP TeamCity server.
  Source: <a href="https://github.com/PHAREHUB/pharehub.github.io/tree/main/tools/report">tools/report</a>.
</footer>
</div>
<div id="tip" hidden></div>
<script>
(() => {
  const tip = document.getElementById("tip");
  const show = (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect(), half = tip.offsetWidth / 2 + 8;
    tip.style.left = Math.min(Math.max(r.left + r.width / 2, half), innerWidth - half) + "px";
    tip.style.top = Math.max(r.top, 30) + "px";
  };
  document.addEventListener("pointerover", show);
  document.addEventListener("focusin", show);
  document.addEventListener("pointerleave", () => { tip.hidden = true; });
  document.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });
})();
</script>
{% if standalone %}
</body>
</html>
{% endif %}
