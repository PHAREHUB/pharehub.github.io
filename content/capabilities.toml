# What PHARE can and cannot do today. status: "yes" | "partial" | "no".
# Each row cites its source in the PHARE repo (upstream/master, 2026-10-27).

[[rows]]
feature = "Dimensions"
status = "yes"
detail = "1D, 2D and 3D. 3D hybrid runs were added in April 2026; there is no 3D functional test in the test suite yet."
source = "possibleSimulators(); PR #1158; tests/functional/harris/CMakeLists.txt registers harris_2d only"

[[rows]]
feature = "Particle shape"
status = "yes"
detail = "Interpolation orders 1, 2 and 3."
source = "possibleSimulators()"

[[rows]]
feature = "Ion populations"
status = "yes"
detail = "Any number of populations, each initialised as a drifting Maxwellian whose density, bulk velocity and thermal speeds are Python functions."
source = "pyphare/pharein/maxwellian_fluid_model.py"

[[rows]]
feature = "Electrons"
status = "partial"
detail = "Massless fluid with an isothermal closure (uniform Te). Ohm's law includes resistivity and hyper-resistivity, the latter on by default (1e-4, constant or spatially varying)."
source = "pyphare/pharein/electron_model.py; simulation.py check_hyper_resistivity()"

[[rows]]
feature = "Mesh refinement"
status = "yes"
detail = "Refinement ratio 2. Levels defined by fixed boxes, or by automatic tagging on magnetic field variations. Each finer level takes four sub-steps per parent step."
source = "hierarchy.hpp:380; default_tagger_strategy.hpp; multiphysics_integrator.hpp getMaxFinerLevelDt"

[[rows]]
feature = "Coarse-fine interpolation"
status = "yes"
detail = "Second order in space and time. Fields are prolonged with linear stencils; the magnetic field then gets a divergence-preserving correction (Balsara et al. 2023). Ghost values at level boundaries are interpolated linearly in time."
source = "src/amr/data/field/refine/composite_field_refiner.hpp; magnetic_refine_patch_strategy.hpp:100-118; hybrid_hybrid_messenger_strategy.hpp:714,746; PR #1278"
link = "https://github.com/PHAREHUB/PHARE/pull/1278"

[[rows]]
feature = "Boundary conditions"
status = "partial"
detail = "Periodic by default. Open, reflective and super-magnetofast inflow boundaries are available for MHD runs only; hybrid runs are periodic."
source = "pyphare/pharein/boundary.py:187-192 (MHD only); PR #1318"
link = "https://github.com/PHAREHUB/PHARE/pull/1318"

[[rows]]
feature = "MHD"
status = "partial"
detail = "A standalone finite-volume MHD solver (ideal or Hall) with constrained transport and adaptive time stepping. The default build mostly uses the Rusanov flux; other Riemann solvers need a custom build. MHD and hybrid levels in one run: in development."
source = "src/amr/solvers/solver_mhd.hpp; res/sim/all.txt; simulation.py 'hall'; PR #1309"
link = "https://github.com/PHAREHUB/PHARE/pull/1309"
validate = true

[[rows]]
feature = "Parallelism"
status = "yes"
detail = "MPI. Optional dynamic load balancing by particle count or by cell count. Multithreading is in development."
source = "pyphare/pharein/load_balancer.py; initialize/general.py:74; PR #1324"
link = "https://github.com/PHAREHUB/PHARE/pull/1324"

[[rows]]
feature = "Output"
status = "yes"
detail = "HDF5 diagnostics (phareh5) or VTK-HDF (pharevtkhdf, readable by ParaView); checkpoint and restart."
source = "pyphare/pharein/simulation.py diag_options, restart_options"

[[rows]]
feature = "Installation"
status = "partial"
detail = "Build from source: CMake, MPI, parallel HDF5, Python 3.11 or later; SAMRAI is fetched or reused. No binary package."
source = "PHARE/readme.md; CMakeLists.txt:24"
