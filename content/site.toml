# Site-wide facts. Every claim cites where it comes from; "validate" marks text the team must check.

name = "PHARE"
expansion = "Parallel Hybrid particle-in-cell code with Adaptive mesh REfinement"
# source: PHARE/readme.md
summary = """PHARE is a hybrid particle-in-cell code: it follows any number of ion populations \
as particles (Vlasov equation) and models electrons as a single fluid whose momentum equation \
gives the electric field. Patch-based adaptive mesh refinement, from the SAMRAI library, \
increases the resolution only where the solution needs it, to bridge sub-ion scales and \
large MHD scales."""
tagline = "Kinetic ions where it matters, at the scale of whole systems."
validate_tagline = true

github = "https://github.com/PHAREHUB/PHARE"
docs = "https://phare.readthedocs.io/en/latest/"
