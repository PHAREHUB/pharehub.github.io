# Site-wide facts. Every claim cites where it comes from; "validate" marks text the team must check.

name = "PHARE"
expansion = "Parallel hybrid particle-in-cell code with adaptive mesh refinement"
# sources: PHARE/readme.md, pyphare/pharein/electron_model.py, src/amr/tagging/, possibleSimulators()
summary = """PHARE is an open-source hybrid particle-in-cell code for collisionless plasmas. \
Ions are followed as macro-particles; electrons are a massless, isothermal fluid whose momentum \
equation gives the electric field. Patch-based adaptive mesh refinement (SAMRAI) refines the grid \
in user-defined boxes or where the magnetic field varies sharply. PHARE runs in 1D, 2D and 3D \
with MPI and is driven from Python."""

github = "https://github.com/PHAREHUB/PHARE"
docs = "https://phare.readthedocs.io/en/latest/"
youtube = "https://www.youtube.com/@PHARE-v1u"
