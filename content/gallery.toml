# Test cases distributed with PHARE (tests/functional/ in the PHARE repo), checked against the scripts.

[[setups]]
name = "Harris current sheets"
model = "hybrid"
dims = "2D, 3D"
path = "tests/functional/harris"
what = "Two Harris sheets in a periodic box with localized perturbations; automatic refinement on two levels."

[[setups]]
name = "Magnetic jump"
model = "hybrid"
dims = "1D"
path = "tests/functional/shock"
what = "Shocks launched by a large jump in the magnetic field (Riemann-type initial condition)."

[[setups]]
name = "Alfvén wave"
model = "hybrid"
dims = "1D"
path = "tests/functional/alfven_wave"
what = "Propagation of an Alfvén wave."

[[setups]]
name = "Ion-ion beam instability"
model = "hybrid"
dims = "1D"
path = "tests/functional/ionIonBeam"
what = "Instability driven by two ion populations, on three levels; the measured growth rate is compared with the expected 0.09."

[[setups]]
name = "Noise spectrum"
model = "hybrid"
dims = "1D"
path = "tests/functional/dispersion"
what = "Waves grown from particle noise, for dispersion analysis."

[[setups]]
name = "Orszag-Tang vortex"
model = "MHD"
dims = "2D, 3D"
path = "tests/functional/mhd_orszagtang"
what = "Standard MHD test problem (Orszag and Tang 1979)."

[[setups]]
name = "MHD rotor"
model = "MHD"
dims = "2D"
path = "tests/functional/mhd_rotor"
what = "Rotating dense disc in a uniform medium."

[[setups]]
name = "MHD shock tube"
model = "MHD"
dims = "1D"
path = "tests/functional/mhd_shock"
what = "One-dimensional Riemann problem."
