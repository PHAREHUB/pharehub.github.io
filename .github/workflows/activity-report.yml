# Weekly PHARE activity report + site rebuild.
# Mondays: collect last week's data from GitHub and TeamCity into data/, regenerate reports/
# and the site pages, commit (GitHub Pages serves them).
# Pushes that change the site sources: rebuild the site only.
name: activity report

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, right after the ISO week ends
  workflow_dispatch:
    inputs:
      period:
        description: "ISO week to (re)generate, e.g. 2026-W40. Empty = last complete week."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["content/**", "static/**", "tools/**"]

permissions:
  contents: write

concurrency:
  group: activity-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r tools/report/requirements.txt

      - name: Test
        run: |
          (cd tools/report && python -m pytest -q tests)
          (cd tools/site && python -m pytest -q tests)

      - name: Collect last week
        if: github.event_name != 'push'
        working-directory: tools/report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ inputs.period }}
        run: python -m phare_report.collect $PERIOD --data ../../data

      - name: Refresh good first issues
        if: github.event_name != 'push'
        working-directory: tools/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m phare_site.fetch --root ../..

      - name: Render reports and site
        run: |
          (cd tools/report && python -m phare_report.render --data ../../data --out ../../reports)
          (cd tools/site && python -m phare_site.build --root ../.. && python -m phare_site.check --root ../..)

      - name: Commit
        env:
          PERIOD: ${{ inputs.period }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports *.html
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          if [ "$EVENT" = push ]; then MSG="site: rebuild"; else MSG="activity report ${PERIOD:-$(date -u +%G-W%V --date='7 days ago')}"; fi
          git commit -m "$MSG"
          git push
